<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Səhifə tapılmadı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('al_theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--brand:#FF7A00;--brand-hi:#FFB15C;--brand-deep:#F26B00;--rgb:255,122,0;--bg:#FFFAF5;--surface:#FFFFFF;--line:#F1E4D6;--ink:#2A2019;--soft:#6F6257;--faint:#A69788;--tag:#D25E00}
:root[data-theme="dark"]{--bg:#0D1220;--surface:#141B2D;--line:rgba(148,163,196,.15);--ink:#E6EBF5;--soft:#9AA6BE;--faint:#67738D;--tag:#FF9A3D}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:radial-gradient(700px 420px at 50% -6%,rgba(var(--rgb),.16),transparent 70%),var(--bg);-webkit-text-size-adjust:100%}
.in{margin:auto;width:100%;max-width:520px;padding:calc(40px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));text-align:center;display:flex;flex-direction:column;align-items:center}
.art{position:relative;width:168px;height:168px;margin-bottom:22px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(var(--rgb),.18),rgba(var(--rgb),.04) 62%,transparent 70%)}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(var(--rgb),.28);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ic{position:relative;width:112px;height:112px;border-radius:34px;display:grid;place-items:center;background:linear-gradient(150deg,var(--brand-hi),var(--brand) 55%,var(--brand-deep));box-shadow:0 22px 44px -18px rgba(var(--rgb),.75);animation:bob 4s ease-in-out infinite}
.ic svg{width:56px;height:56px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lion{position:absolute;right:6px;bottom:8px;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--surface);border:3px solid var(--bg);box-shadow:0 8px 18px -8px rgba(0,0,0,.35);color:var(--brand)}
.lion svg{width:28px;height:28px}
.tag{display:inline-flex;padding:6px 14px;border-radius:99px;background:rgba(var(--rgb),.12);color:var(--tag);font-size:12px;line-height:1.3;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h1{margin-top:14px;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
p{margin-top:10px;font-size:15.5px;line-height:1.65;color:var(--soft);max-width:440px}
ul{list-style:none;margin:20px 0 0;padding:14px 16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;text-align:left;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
li{display:flex;gap:10px;font-size:14.5px;line-height:1.5}
li i{flex:none;width:20px;height:20px;margin-top:1px;border-radius:7px;display:grid;place-items:center;background:rgba(var(--rgb),.12);color:var(--brand);font-style:normal;font-size:12px;font-weight:800}
a.btn{margin-top:22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:14px;background:linear-gradient(135deg,var(--brand-hi),var(--brand) 60%,var(--brand-deep));color:#fff;font-weight:600;font-size:15px;text-decoration:none;box-shadow:0 12px 24px -12px rgba(var(--rgb),.8)}
a.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:26px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
@media (max-width:560px){.art{width:144px;height:144px}.ic{width:96px;height:96px;border-radius:30px}.ic svg{width:48px;height:48px}h1{font-size:24px}p{font-size:15px}a.btn{width:100%}}
@media (prefers-reduced-motion:reduce){.ic,.ring::before{animation:none}}
</style>
</head>
<body>
<main class="in">
  <div class="art"><span class="ring"></span><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16l2-6 6-2-2 6-6 2z"/><circle cx="12" cy="12" r="9"/></svg></span><span class="lion"><svg viewBox="0 0 100 100" aria-hidden="true"><path id="lg" fill="currentColor" fill-rule="evenodd" d="M50 16L93 37L50 58L7 37Z M26 48.5V65C26 73.5 38 80 50 80C62 80 74 73.5 74 65V48.5L50 60.5Z M84 41H89V65H84Z M81.5 63H91.5V74H81.5Z"/></svg></span></div>
  <span class="tag">Xəta 404</span>
  <h1>Səhifə tapılmadı</h1>
  <p>Axtardığınız səhifə mövcud deyil və ya ünvan səhv yazılıb. Ola bilər ki, link köhnədir və ya səhifə başqa yerə köçürülüb.</p>
  <ul><li><i>✓</i><span>Ünvanı bir daha yoxlayın</span></li><li><i>✓</i><span>Ana səhifədən lazımi bölməyə keçin</span></li></ul>
  <a class="btn" id="home" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Sayta keç</a>
  <p class="foot" id="ft"></p>
</main>
<script>
(function(){try{var b=JSON.parse(localStorage.getItem('al_brand')||'null');if(b){var r=document.documentElement.style;r.setProperty('--brand',b.or);r.setProperty('--brand-hi',b.hi);r.setProperty('--brand-deep',b.deep);r.setProperty('--rgb',b.rgb);if(document.documentElement.dataset.theme!=='dark'){r.setProperty('--tag',b.text);r.setProperty('--bg',b.bg);r.setProperty('--line',b.line);r.setProperty('--ink',b.ink);r.setProperty('--soft',b.soft);r.setProperty('--faint',b.faint);}else{r.setProperty('--tag',b.dText);}if(b.logo)document.getElementById('lg').setAttribute('d',b.logo);if(b.name){document.getElementById('ft').textContent=b.name;document.title='Səhifə tapılmadı · '+b.name;}}}catch(e){}})();
(function(){var p=location.pathname.split('/').filter(Boolean),b='/';try{var s=localStorage.getItem('al_base');if(s&&s.charAt(0)==='/'){document.getElementById('home').setAttribute('href',s);return;}}catch(e){}if(/\.github\.io$/.test(location.hostname)&&p.length)b='/'+p[0]+'/';document.getElementById('home').setAttribute('href',b);})();
</script>
</body>
</html>
